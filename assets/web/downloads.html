<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>下载管理</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #0b1220;
        --border: rgba(255, 255, 255, 0.08);
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #22d3ee;
        --success: #34d399;
        --danger: #fb7185;
        --warning: #f59e0b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background: radial-gradient(1200px 600px at 20% -10%, #1e293b, transparent),
          radial-gradient(1000px 500px at 120% 0%, #0e7490, transparent),
          var(--bg);
        min-height: 100vh;
      }
      .page {
        max-width: 1080px;
        margin: 0 auto;
        padding: 32px 24px 60px;
      }
      .title {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 18px;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }
      .summary-card,
      .section {
        background: linear-gradient(180deg, var(--panel), var(--panel-2));
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .summary-card {
        padding: 16px 18px;
      }
      .summary-card .label {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
      }
      .summary-card .value {
        font-size: 26px;
        font-weight: 700;
      }
      .section {
        padding: 10px 0;
      }
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 18px 8px;
      }
      .section-header h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      .section-header .hint {
        color: var(--muted);
        font-size: 12px;
      }
      .list {
        display: flex;
        flex-direction: column;
      }
      .download-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: center;
        padding: 16px 18px;
        border-top: 1px solid var(--border);
      }
      .download-row.is-active {
        background: rgba(34, 211, 238, 0.04);
      }
      .download-row.is-missing {
        background: rgba(245, 158, 11, 0.05);
      }
      .row-main {
        min-width: 0;
      }
      .row-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 6px;
      }
      .title,
      .source,
      .status,
      .time,
      .progress-text {
        word-break: break-all;
      }
      .row-top .title {
        margin: 0;
        font-size: 14px;
      }
      .time {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .meta {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .status {
        font-size: 13px;
        color: var(--text);
      }
      .source {
        font-size: 12px;
        color: var(--muted);
      }
      .progress-wrap {
        margin-top: 12px;
      }
      .progress-bar {
        width: 100%;
        height: 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .progress-value {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #06b6d4, var(--accent));
      }
      .progress-text {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .row-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .action-btn {
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 12px;
        cursor: pointer;
        transition: 0.18s ease;
      }
      .action-btn:hover:not(:disabled) {
        transform: translateY(-1px);
        border-color: rgba(255, 255, 255, 0.18);
      }
      .action-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .action-btn.secondary {
        color: var(--accent);
      }
      .action-btn.danger {
        color: #fecdd3;
        border-color: rgba(251, 113, 133, 0.25);
        background: rgba(251, 113, 133, 0.08);
      }
      .action-btn.icon {
        width: 32px;
        height: 32px;
        padding: 0;
        font-size: 18px;
        line-height: 1;
      }
      .empty {
        padding: 36px 18px 32px;
        color: var(--muted);
        text-align: center;
        font-size: 13px;
      }
      @media (max-width: 760px) {
        .summary {
          grid-template-columns: 1fr;
        }
        .download-row {
          grid-template-columns: 1fr;
        }
        .row-actions {
          justify-content: flex-start;
          flex-wrap: wrap;
        }
        .row-top {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="title">下载管理</div>

      <div class="summary">
        <div class="summary-card">
          <div class="label">全部记录</div>
          <div class="value" id="summary-total">0</div>
        </div>
        <div class="summary-card">
          <div class="label">正在下载</div>
          <div class="value" id="summary-active">0</div>
        </div>
        <div class="summary-card">
          <div class="label">已完成</div>
          <div class="value" id="summary-completed">0</div>
        </div>
      </div>

      <div class="section">
        <div class="section-header">
          <h2>下载列表</h2>
          <div class="hint">正在下载时可取消，已完成可打开文件夹或删除</div>
        </div>
        <div class="list" id="download-list"></div>
        <div class="empty" id="empty-state" hidden>暂无下载记录</div>
      </div>
    </div>
  </body>
</html>
