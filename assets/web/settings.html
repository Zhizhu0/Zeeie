<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>设置</title>
    <link rel="stylesheet" href="styles/settings.css" />
  </head>
  <body>
    <div class="page">
      <div class="title">设置</div>

      <div class="section">
        <h2>脚本管理</h2>

        <div class="subsection">
          <div id="system-script-title" class="subsection-title">
            <div class="title-row">
              <h3>系统脚本</h3>
              <span class="collapse-toggle">&gt;</span>
            </div>
          </div>
          <div id="system-script-content" class="subsection-content">
            <div class="subsection-content-inner">
            <div class="script-header system-script-header">
              <div>脚本</div>
              <div>版本</div>
              <div>启用</div>
            </div>
            <div id="system-script-list"></div>
            <div id="system-empty" class="empty" hidden>无系统脚本</div>
            </div>
          </div>
        </div>

        <div class="subsection">
          <div id="user-script-title" class="subsection-title">
            <div class="title-row">
              <h3>用户脚本</h3>
              <span class="collapse-toggle">&gt;</span>
            </div>
            <button id="add-user-script" type="button" class="button">新增用户脚本</button>
          </div>
          <div id="user-script-content" class="subsection-content">
            <div class="subsection-content-inner">
            <div class="script-header user-script-header">
              <div>脚本</div>
              <div>作者</div>
              <div>版本</div>
              <div>启用</div>
              <div>操作</div>
            </div>
            <div id="user-script-list"></div>
            <div class="hint">在脚本头中填写 `@name`、`@namespace`、`@version` 等信息后，列表会自动显示对应元数据。</div>
            <div id="user-empty" class="empty">无用户脚本</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="script-modal-backdrop" class="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="script-modal-title">
        <div class="modal-header">
          <div id="script-modal-title" class="modal-title">新增用户脚本</div>
          <button id="close-script-modal" type="button" class="button secondary">关闭</button>
        </div>
        <div class="modal-body">
          <label for="script-content" class="field-label">脚本内容</label>
          <textarea
            id="script-content"
            class="script-editor"
            spellcheck="false"
            placeholder="// ==UserScript==
// @name         示例用户脚本
// @namespace    Zeeie
// @version      1.0.0
// @match        *://*/*
// ==/UserScript==

(function () {
  'use strict';
})();"
          ></textarea>
          <div id="script-modal-message" class="modal-message"></div>
        </div>
        <div class="modal-footer">
          <button id="cancel-script-save" type="button" class="button secondary">取消</button>
          <button id="save-user-script" type="button" class="button">保存</button>
        </div>
      </div>
    </div>
  </body>
</html>
