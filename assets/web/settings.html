<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>设置</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #0b1220;
        --border: rgba(255, 255, 255, 0.08);
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #22d3ee;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background: radial-gradient(1200px 600px at 20% -10%, #1e293b, transparent),
          radial-gradient(1000px 500px at 120% 0%, #0e7490, transparent),
          var(--bg);
        min-height: 100vh;
      }
      .page {
        max-width: 980px;
        margin: 0 auto;
        padding: 32px 24px 60px;
      }
      .title {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 18px;
      }
      .section {
        background: linear-gradient(180deg, var(--panel), var(--panel-2));
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px 18px 8px;
        margin-bottom: 18px;
      }
      .section h2 {
        font-size: 16px;
        margin: 0 0 12px;
        color: var(--muted);
        font-weight: 500;
      }
      .subsection {
        margin-bottom: 18px;
      }
      .subsection h3 {
        font-size: 14px;
        margin: 14px 0 10px;
        color: var(--text);
        font-weight: 600;
      }
      .script-header,
      .script-row {
        display: grid;
        grid-template-columns: 2.6fr 1.2fr 0.8fr 0.6fr;
        gap: 12px;
        align-items: center;
      }
      .script-header {
        font-size: 12px;
        color: var(--muted);
        padding: 6px 8px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 6px;
      }
      .script-row {
        padding: 10px 8px;
        border-bottom: 1px solid var(--border);
      }
      .script-row:last-child {
        border-bottom: none;
      }
      .script-name {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .script-name .primary {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
      }
      .script-name .secondary {
        font-size: 12px;
        color: var(--muted);
      }
      .empty {
        padding: 12px 8px 6px;
        color: var(--muted);
        font-size: 12px;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 36px;
        height: 20px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #374151;
        transition: 0.2s;
        border-radius: 999px;
        border: 1px solid var(--border);
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 14px;
        width: 14px;
        left: 3px;
        top: 2px;
        background-color: #e5e7eb;
        transition: 0.2s;
        border-radius: 50%;
      }
      input:checked + .slider {
        background-color: rgba(34, 211, 238, 0.35);
        border-color: rgba(34, 211, 238, 0.6);
      }
      input:checked + .slider:before {
        transform: translateX(16px);
        background: var(--accent);
      }
      input:disabled + .slider {
        opacity: 0.45;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="title">设置</div>

      <div class="section">
        <h2>脚本管理</h2>

        <div class="subsection">
          <h3>系统脚本</h3>
          <div class="script-header">
            <div>脚本</div>
            <div>作者</div>
            <div>版本</div>
            <div>启用</div>
          </div>
          <div id="system-script-list"></div>
          <div id="system-empty" class="empty" hidden>无系统脚本</div>
        </div>

        <div class="subsection">
          <h3>用户脚本</h3>
          <div class="script-header">
            <div>脚本</div>
            <div>作者</div>
            <div>版本</div>
            <div>启用</div>
          </div>
          <div id="user-script-list"></div>
          <div id="user-empty" class="empty">无用户脚本</div>
        </div>
      </div>
    </div>
  </body>
</html>
